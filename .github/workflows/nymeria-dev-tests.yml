name: NYMERIA DEV Tests

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Full regression or fast Torre Silente visual checks (manual runs never deploy)"
        required: true
        type: choice
        default: full
        options:
          - full
          - torre-fast
  push:
    branches:
      - dev/kaelith-modular-character

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/dev/kaelith-modular-character'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NYMERIA_TEST_URL: http://127.0.0.1:8018
      CI: "true"

    steps:
      - name: Checkout requested DEV branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install isolated browser test dependencies
        run: |
          npm ci
          npm run build:web
          npx playwright install --with-deps chromium
          echo "NYMERIA_CHROMIUM=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"

      - name: Start temporary local HTTP server
        run: |
          python3 -m http.server 8018 --bind 127.0.0.1 > /tmp/nymeria-server.log 2>&1 &
          echo $! > /tmp/nymeria-server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8018/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "HTTP server did not become ready"
          cat /tmp/nymeria-server.log
          exit 1

      - name: Run engine and mobile browser tests
        id: tests
        run: |
          mkdir -p test-results
          failed=0
          # Fast mode is manual-only. Pushes always run the complete regression gate.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.test_scope }}" == "torre-fast" ]]; then
            tests=(tests/torre-silente-v1-browser.cjs)
          else
            tests=(
            tests/*engine.cjs
            tests/fixed-screens-browser.cjs
            tests/fixed-battle-browser.cjs
            tests/fixed-feedback-browser.cjs
            tests/fixed-reward-prompts.cjs
            tests/fixed-screens-journey.cjs
            tests/contextual-combat-browser.cjs
            tests/contextual-panels-browser.cjs
            tests/sprint12-navigation-browser.cjs
            tests/fantasy-identity-browser.cjs
            tests/interface-refinement-browser.cjs
            tests/mobile-foundation-browser.cjs
            tests/mobile-validation-browser.cjs
            tests/torre-silente-v1-browser.cjs
            )
          fi
          printf '## NYMERIA DEV test results\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| Test | Result |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          for test in "${tests[@]}"; do
            name=$(basename "$test" .cjs)
            if [[ ! -f "$test" ]]; then
              result="NOT FOUND"
              failed=1
              echo "Missing test file: $test" > "test-results/$name.log"
            elif timeout 600s node "$test" > "test-results/$name.log" 2>&1; then
              result="PASS"
            else
              result="FAIL"
              failed=1
            fi
            echo "$result $test" | tee -a test-results/summary.txt
            printf '| `%s` | %s |\n' "$test" "$result" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != "PASS" ]]; then
              tail -n 60 "test-results/$name.log"
            fi
          done
          exit "$failed"

      - name: Save test and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nymeria-dev-test-logs
          path: |
            test-results/
            /tmp/nymeria-server.log
          if-no-files-found: warn
          retention-days: 14

  dispatch-preview:
    name: Trigger DEV preview after tests
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev/kaelith-modular-character' && !contains(github.event.head_commit.message, '[skip dev deploy]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger preview workflow for tested SHA
        env:
          DISPATCH_TOKEN: ${{ secrets.DEV_PREVIEW_DISPATCH_TOKEN }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$DISPATCH_TOKEN" ]]; then
            echo "::error::Missing DEV_PREVIEW_DISPATCH_TOKEN secret"
            exit 1
          fi
          curl --fail-with-body --show-error --silent --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Wasaboomer/nymeria-dev-preview/actions/workflows/publish-dev.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"source_sha\":\"$TESTED_SHA\"}}"
