name: NYMERIA Mobile Builds
on:
  push:
    branches: [dev/kaelith-modular-character]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-debug:
    if: github.ref == 'refs/heads/dev/kaelith-modular-character'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run sync:mobile
      - run: npm run test:mobile
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: nymeria-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  ios-unsigned:
    if: github.ref == 'refs/heads/dev/kaelith-modular-character'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run sync:mobile
      - run: npm run test:mobile
      - name: Compile simulator without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/nymeria-ios-derived
          CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: nymeria-ios-simulator-unsigned-${{ github.sha }}
          path: /tmp/nymeria-ios-derived/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
